name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Run validation test
        run: |
          python -c "
          from openpyxl import Workbook
          from main import apply_column_validation
          wb = Workbook()
          ws_main = wb.active
          ws_main.title = 'Records'
          ws_main.append(['Name', 'Status'])
          ws_lists = wb.create_sheet('Lists')
          ws_lists.append(['Status'])
          ws_lists.append(['Active'])
          wb.save('sample_validated.xlsx')
          apply_column_validation('sample_validated.xlsx', 'Records', 'Lists')
          "
